#!/usr/bin/env bash
# ===========================================================================
# DataPower gateway connection details
# ===========================================================================
DP_SERVERS='[
    {
        "mgmt_ip": "1.1.1.1",
        "soma_port": "5550",
        "user_name": "tbd",
        "user_password": "tbd",
        "sb_certificate": "tbd"
    },
    {
        "mgmt_ip": "1.1.1.2",
        "soma_port": "5550",
        "user_name": "tbd",
        "user_password": "tbd",
        "sb_certificate": "tbd"
    },
    {
        "mgmt_ip": "1.1.1.3",
        "soma_port": "5550",
        "user_name": "tbd",
        "user_password": "tbd",
        "sb_certificate": "tbd"
    }
]'

# ===========================================================================
# DOMAIN QUIESCE configuration
# ===========================================================================
DO_QUIESCE=true
QUIESCE_DOMAIN="tbd"
QUIESCE_TIMEOUT=120

QUIESCE_STATUS_POLL_INTERVAL=10
QUIESCE_STATUS_POLL_MAX_CHECKS=30

GATEWAY_PEERING_SWITCHING=(
    "apic"
    "subs"
    "rate"
    "script"
    "probe"
    "token"
)
# ===========================================================================
# Secure Backup configuration
# ===========================================================================
INCLUDE_ISCSI=off
INCLUDE_RAID=off
DESTINATION=temporary:///
# ===========================================================================
# Git repo configuration
# ===========================================================================
ADD_TO_GIT=false
GIT_REMOTE_NAME=origin
GIT_BRANCH_NAME=main
# ===========================================================================
# LOGGING
# ===========================================================================
LOG_FILE="$FOLDER_LOGS/sb$CUR_TIMESTAMP.log"
EMPTY_LOG_FILE_ON_START=true
DEBUG=true
# ===========================================================================
# INTERNAL - DO NOT CHANGE THE BELOW CONTENT
# ===========================================================================
DP_SOMA_URI=/service/mgmt/3.0
DP_AMP_URI=/service/mgmt/amp/3.0
SB_FOLDER="sb$CUR_TIMESTAMP"
DP_SB_FOLDER=$DESTINATION$SB_FOLDER
